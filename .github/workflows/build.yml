name: Build Ardillita

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o Ardillita_Forge_1.20.1_CORREGIDO.zip -d extracted

      - name: Build
        run: |
          cd extracted/ardillita_mod
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ardillita
          path: extracted/ardillita_mod/build/libs/*.jar
