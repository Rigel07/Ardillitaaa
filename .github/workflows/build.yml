name: Build Ardillita
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find project
        shell: bash
        run: |
          set -e
          BUILD_FILE="$(find extracted -type f -name 'build.gradle' -print -quit)"
          test -n "$BUILD_FILE"
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build mod
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ardillita-Forge-1.20.1
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
